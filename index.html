<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just for you</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a1233;--bg2:#10081a;--ink:#f8e9f0;--soft:#d9aabd;--gold:#e6c58b;--glow:rgba(255,140,170,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg1:#ffe3ec;--bg2:#f3c9dc;--ink:#4a1d33;--soft:#9b5575;--gold:#a4722c;--glow:rgba(220,90,130,.3)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
h1{font-family:"Great Vibes",cursive,serif;font-weight:400;font-size:clamp(34px,8vw,54px);color:var(--gold);margin:0 0 14px;text-shadow:0 0 24px var(--glow)}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:18px;color:var(--ink);background:transparent;border:1px solid var(--soft);border-radius:999px;padding:7px 20px;cursor:pointer;transition:background .3s,box-shadow .3s}
button:hover,button.on{background:var(--glow);box-shadow:0 0 20px var(--glow)}
button:focus-visible,.stage:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.panel{display:none;width:100%;max-width:520px;flex-direction:column;align-items:center}
.panel.on{display:flex}
.tag{font-size:18px;color:var(--gold);margin:0 0 10px;font-style:italic;opacity:0;transition:opacity 1.1s}
.stage{min-height:10em;max-width:28ch;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.q{font-style:italic;font-size:clamp(23px,5.4vw,36px);line-height:1.4;margin:0;opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 1.1s,filter 1.1s,transform 1.1s}
.q.on,.tag.on{opacity:1;filter:blur(0);transform:none}
.nav{display:flex;gap:16px;margin-top:22px}
.dots{display:flex;gap:6px;margin-top:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--soft);opacity:.35;transition:all .4s}
.dots i.on{opacity:1;background:var(--gold);transform:scale(1.5)}
/* game 1 */
#field{position:relative;width:100%;height:46vh;max-height:340px;border:1px dashed var(--soft);border-radius:20px;overflow:hidden;touch-action:manipulation}
.h{position:absolute;top:-40px;font-size:34px;cursor:pointer;user-select:none;animation:fall linear forwards;line-height:1;background:none;border:0;padding:4px}
@keyframes fall{to{transform:translateY(60vh) rotate(25deg)}}
.h.pop{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(2.2);opacity:0}}
.msg{font-size:clamp(20px,4.5vw,28px);font-style:italic;margin:16px 0 0;min-height:3.2em;line-height:1.4}
.score{margin-top:12px;font-size:20px;color:var(--soft)}
/* game 2 */
.ask{font-size:clamp(26px,6vw,40px);font-style:italic;margin:0 0 24px;line-height:1.3}
.row{position:relative;height:140px;width:100%}
.row button{position:absolute;top:10px}
#yes{left:6%;font-size:22px;padding:10px 26px;border-color:var(--gold)}
#no{left:58%;transition:left .25s,top .25s}
@media (prefers-reduced-motion:reduce){.q,.tag{transition:opacity .3s}.h{animation-duration:6s!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <h1 id="to">Just for you</h1>
  <div class="tabs" role="tablist">
    <button class="on" data-p="p1">Little notes</button>
    <button data-p="p2">Catch my hearts</button>
    <button data-p="p3">One question</button>
  </div>

  <section class="panel on" id="p1">
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Next note">
      <p class="tag" id="tag"></p>
      <p class="q" id="q"></p>
    </div>
    <div class="dots" id="dots"></div>
    <div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
  </section>

  <section class="panel" id="p2">
    <div id="field" aria-label="Tap the falling hearts"></div>
    <div class="score" id="score">Hearts caught: 0 / 10</div>
    <p class="msg" id="gmsg">Tap the hearts before they fall.</p>
    <button id="again" style="display:none;margin-top:6px">Play again</button>
  </section>

  <section class="panel" id="p3">
    <p class="ask" id="ask">Can I have one flying kiss from you? I'll catch it, and I promise to return it with interest.</p>
    <div class="row"><button id="yes">Catch it 💋</button><button id="no">I'll pass</button></div>
    <p class="msg" id="amsg"></p>
  </section>
</main>

<script>
/* ===== EDIT THESE ===== */
var HER_NAME = "";   // put her name here, e.g. "Priya"
var AUTO_MS = 8000;  // time before the next note appears
var GOAL = 10;       // hearts to catch in the game
var GIVE_UP_AFTER = 5; // how many times the No button escapes

var NOTES = [
  ["missing you", "I miss you. No pressure to reply, I just wanted you to know."],
  ["your smile", "Somewhere today, someone is smiling because you exist. That someone is me."],
  ["funny", "I tried to be mad at you, but my heart said, 'Not today, she's our favourite.'"],
  ["patience", "Take your time. Good things are worth waiting for, and so are good people."],
  ["memories", "I still remember how our talks made hours feel like minutes."],
  ["funny", "My phone and I made a deal: it stays quiet, I stay patient. Only one of us is doing well."],
  ["hope", "Whatever you are going through, I hope today is a little gentler on you."],
  ["thank you", "Thank you for every moment you gave me. I never took any of them lightly."],
  ["honest", "I'm not perfect, but the care I have for you is real."],
  ["funny", "If you were a vegetable, you'd be a cute-cumber. Okay, I'll stop. But you smiled, right?"],
  ["promise", "Whenever you're ready, I'll be here. No rush, no pressure."]
];

/* funny replies when she tries to press "I'll pass" (one per escape) */
var TEASE = [
  "Missed it! Try again 😄",
  "Even the button is dodging my kiss.",
  "The kiss is already on its way, you can't stop it.",
  "Still trying? You're so stubborn, I love it.",
  "Last try... the button is getting tired."
];
var GIVE_UP_MSG = "The button gave up. Just catch it 💗";
var YES_TITLE = "Caught it! Returning it with interest 💗";
var YES_MSG = "Thank you. That's all I wanted.";

/* ===== name ===== */
if (HER_NAME) document.getElementById('to').textContent = 'For ' + HER_NAME;

/* ===== tabs ===== */
var tabBtns = document.querySelectorAll('.tabs button');
tabBtns.forEach(function (b) {
  b.onclick = function () {
    tabBtns.forEach(function (x) { x.classList.toggle('on', x === b); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === b.dataset.p); });
    if (b.dataset.p === 'p2') startGame(); else stopGame(true);
  };
});

/* ===== notes slider ===== */
var i = 0, q = document.getElementById('q'), tag = document.getElementById('tag'), dots = document.getElementById('dots'), timer;
NOTES.forEach(function () { dots.appendChild(document.createElement('i')); });
function show(n) {
  i = (n + NOTES.length) % NOTES.length;
  q.classList.remove('on'); tag.classList.remove('on');
  setTimeout(function () {
    tag.textContent = NOTES[i][0]; q.textContent = NOTES[i][1];
    void q.offsetWidth; q.classList.add('on'); tag.classList.add('on');
    [].forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === i); });
  }, 450);
  clearInterval(timer); timer = setInterval(function () { show(i + 1); }, AUTO_MS);
}
document.getElementById('next').onclick = function () { show(i + 1); };
document.getElementById('prev').onclick = function () { show(i - 1); };
document.getElementById('stage').onclick = function () { show(i + 1); };
document.getElementById('stage').onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(i + 1); } };
show(0);

/* ===== game 1: catch hearts ===== */
var field = document.getElementById('field'), score = 0, spawn = null, done = false;
var WIN = [
  "You caught all ten! Each one is a reason I smile when I think of you.",
  "Ten hearts, zero misses. Now catch one more: mine. It's already yours."
];
function addHeart() {
  var h = document.createElement('button');
  h.className = 'h'; h.textContent = ['💗','💖','💕','🩷'][Math.floor(Math.random() * 4)];
  h.setAttribute('aria-label', 'heart');
  h.style.left = (5 + Math.random() * 85) + '%';
  h.style.animationDuration = (3 + Math.random() * 2.5) + 's';
  h.onclick = function () {
    if (done || h.classList.contains('pop')) return;
    h.classList.add('pop'); score++;
    document.getElementById('score').textContent = 'Hearts caught: ' + score + ' / ' + GOAL;
    setTimeout(function () { h.remove(); }, 350);
    if (score >= GOAL) win();
  };
  h.addEventListener('animationend', function (e) { if (e.animationName === 'fall') h.remove(); });
  field.appendChild(h);
}
function win() {
  done = true; clearInterval(spawn);
  document.getElementById('gmsg').textContent = WIN[Math.floor(Math.random() * WIN.length)];
  document.getElementById('again').style.display = 'inline-block';
}
function startGame() {
  stopGame(true); score = 0; done = false;
  document.getElementById('score').textContent = 'Hearts caught: 0 / ' + GOAL;
  document.getElementById('gmsg').textContent = 'Tap the hearts before they fall.';
  document.getElementById('again').style.display = 'none';
  spawn = setInterval(addHeart, 650); addHeart();
}
function stopGame(clear) { clearInterval(spawn); if (clear) field.innerHTML = ''; }
document.getElementById('again').onclick = startGame;

/* ===== game 2: the kiss question ===== */
var no = document.getElementById('no'), yes = document.getElementById('yes'), tries = 0;
function dodge() {
  tries++;
  if (tries > GIVE_UP_AFTER) {            // the button gives up and becomes a second Yes
    no.textContent = "Okay, Yes 💗";
    no.onmouseenter = null;
    no.ontouchstart = null;
    no.onclick = function () { yes.click(); };
    document.getElementById('amsg').textContent = GIVE_UP_MSG;
    return;
  }
  var row = no.parentElement;
  var w = row.clientWidth - no.offsetWidth;
  var h = row.clientHeight - no.offsetHeight;
  no.style.left = Math.max(0, Math.random() * w) + 'px';
  no.style.top = Math.max(0, Math.random() * h) + 'px';
  document.getElementById('amsg').textContent = TEASE[Math.min(tries - 1, TEASE.length - 1)];
}
no.onmouseenter = dodge;
no.ontouchstart = function (e) { e.preventDefault(); dodge(); };
no.onclick = dodge;
yes.onclick = function () {
  document.getElementById('ask').textContent = YES_TITLE;
  document.getElementById('amsg').textContent = YES_MSG;
  no.style.display = 'none'; yes.style.display = 'none';
  for (var k = 0; k < 26; k++) burst();
};
function burst() {
  var s = document.createElement('span');
  s.textContent = ['💗','💖','💋','✨','🌸'][Math.floor(Math.random() * 5)];
  s.style.cssText = 'position:fixed;z-index:5;left:50%;top:55%;font-size:' + (18 + Math.random() * 22) + 'px;pointer-events:none;transition:transform 1.6s ease-out,opacity 1.6s';
  document.body.appendChild(s);
  requestAnimationFrame(function () {
    s.style.transform = 'translate(' + (Math.random() * 500 - 250) + 'px,' + (Math.random() * -420 - 40) + 'px) rotate(' + (Math.random() * 90 - 45) + 'deg)';
    s.style.opacity = '0';
  });
  setTimeout(function () { s.remove(); }, 1700);
}

/* ===== background petals + stars ===== */
var cv = document.getElementById('bg'), cx = cv.getContext('2d'), W, H, P = [];
var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
function size() { var r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0); }
addEventListener('resize', size); size();
function mk(init) { return { x: Math.random() * W, y: init ? Math.random() * H : -20, s: 5 + Math.random() * 9, v: .3 + Math.random() * .7, sw: Math.random() * 6, a: Math.random() * 6.28, r: Math.random() * .02 - .01, star: Math.random() < .35, o: .25 + Math.random() * .5 }; }
for (var k = 0; k < (reduce ? 16 : 40); k++) P.push(mk(true));
function draw(p) {
  cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.globalAlpha = p.o;
  if (p.star) { cx.fillStyle = '#fff3d6'; cx.shadowColor = '#ffe9b0'; cx.shadowBlur = 8; cx.beginPath(); cx.arc(0, 0, p.s / 6, 0, 6.28); cx.fill(); }
  else { cx.fillStyle = '#ff8fb1'; cx.beginPath(); cx.moveTo(0, -p.s); cx.bezierCurveTo(p.s * .9, -p.s * .5, p.s * .7, p.s * .6, 0, p.s); cx.bezierCurveTo(-p.s * .7, p.s * .6, -p.s * .9, -p.s * .5, 0, -p.s); cx.fill(); }
  cx.restore();
}
function tick(t) {
  cx.clearRect(0, 0, W, H);
  P.forEach(function (p, n) {
    if (!reduce) { p.y += p.v * (p.star ? .3 : 1); p.x += Math.sin(t / 1200 + p.sw) * .5; p.a += p.r; }
    if (p.y > H + 20) P[n] = mk(false);
    draw(p);
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
