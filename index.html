
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Lost Me Forever</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020208;
    font-family: "Helvetica Neue", Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#message {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 2;
}

#word {
    position: absolute;
    font-size: clamp(40px, 11vw, 115px);
    font-weight: 300;
    letter-spacing: 0.12em;
    color: white;
    opacity: 0;
    transition: color 2s ease, text-shadow 2s ease;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
    white-space: nowrap;
}

#word.rose {
    color: #ffe1eb;
    text-shadow:
        0 0 15px rgba(255,180,205,0.6),
        0 0 40px rgba(255,100,150,0.3),
        0 0 80px rgba(255,70,130,0.2);
}

#hint {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.2);
    z-index: 5;
    opacity: 0.5;
}

#vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,0.25) 75%,
        rgba(0,0,0,0.75) 100%
    );
}

#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
}

@media (max-width: 600px) {
    #word {
        letter-spacing: 0.08em;
    }
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="message">
    <div id="word"></div>
</div>

<div id="vignette"></div>
<div id="flash"></div>
<div id="hint">CLICK ANYWHERE TO REPLAY</div>

<script>
/* ==========================================
   YOU LOST ME FOREVER
   Single-file cinematic particle animation
========================================== */

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

const wordEl = document.getElementById("word");
const flashEl = document.getElementById("flash");

let W, H, DPR;
let stars = [];
let particles = [];
let animationId;

let roseMode = false;
let heartMode = false;
let running = false;

/* ==========================================
   COLORS
========================================== */

const WHITE = [255, 255, 255];
const ROSE  = [255, 185, 210];
const PINK  = [255, 110, 165];

/* ==========================================
   RESIZE
========================================== */

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    createStars();
}

window.addEventListener("resize", resize);

/* ==========================================
   BACKGROUND STARS
========================================== */

function createStars() {
    stars = [];

    const count = Math.floor((W * H) / 2200);

    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            radius: Math.random() * 1.5 + 0.2,
            alpha: Math.random() * 0.7 + 0.1,
            speed: Math.random() * 0.25 + 0.05,
            phase: Math.random() * Math.PI * 2,
            color: Math.random() > 0.92 ? ROSE : WHITE
        });
    }
}

function drawStars() {
    stars.forEach(s => {
        s.phase += 0.015;

        const twinkle = 0.5 + Math.sin(s.phase) * 0.5;
        const alpha = s.alpha * twinkle;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);

        ctx.fillStyle =
            `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${alpha})`;

        ctx.fill();

        s.y += s.speed;

        if (s.y > H) {
            s.y = 0;
            s.x = Math.random() * W;
        }
    });
}

/* ==========================================
   NEBULA
========================================== */

function drawNebula() {
    const t = performance.now() * 0.0001;

    const x = W * (0.5 + Math.sin(t) * 0.12);
    const y = H * (0.5 + Math.cos(t * 1.3) * 0.12);

    const gradient = ctx.createRadialGradient(
        x, y, 0,
        x, y, Math.min(W, H) * 0.65
    );

    if (roseMode) {
        gradient.addColorStop(0, "rgba(120,35,75,0.09)");
        gradient.addColorStop(0.4, "rgba(70,20,50,0.05)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
    } else {
        gradient.addColorStop(0, "rgba(35,40,100,0.10)");
        gradient.addColorStop(0.4, "rgba(20,20,65,0.05)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
    }

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}

/* ==========================================
   PARTICLE CLASS
========================================== */

class Particle {
    constructor(x, y, color = WHITE, size = 1.5) {
        this.x = Math.random() * W;
        this.y = Math.random() * H;

        this.tx = x;
        this.ty = y;

        this.vx = 0;
        this.vy = 0;

        this.color = color;
        this.size = size * (0.5 + Math.random());
        this.alpha = 0;

        this.friction = 0.88;
        this.exploding = false;
        this.fadeOut = false;
    }

    update() {
        if (this.exploding) {
            this.x += this.vx;
            this.y += this.vy;

            this.vx *= 0.985;
            this.vy *= 0.985;

            this.alpha -= 0.008;

            return;
        }

        const dx = this.tx - this.x;
        const dy = this.ty - this.y;

        this.vx += dx * 0.025;
        this.vy += dy * 0.025;

        this.vx *= this.friction;
        this.vy *= this.friction;

        this.x += this.vx;
        this.y += this.vy;

        this.alpha = Math.min(1, this.alpha + 0.035);
    }

    draw() {
        if (this.alpha <= 0) return;

        const [r, g, b] = this.color;

        ctx.save();

        ctx.globalAlpha = Math.max(0, this.alpha);

        ctx.shadowBlur = roseMode ? 12 : 8;
        ctx.shadowColor = `rgb(${r},${g},${b})`;

        ctx.fillStyle = `rgb(${r},${g},${b})`;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    explode(force = 8) {
        this.exploding = true;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * force + 1;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
    }
}

/* ==========================================
   TEXT PARTICLE GENERATOR
========================================== */

function getTextPoints(text, color = WHITE) {
    const off = document.createElement("canvas");
    const o = off.getContext("2d");

    off.width = W;
    off.height = H;

    const fontSize = Math.min(W * 0.16, H * 0.2, 130);

    o.font = `300 ${fontSize}px Helvetica Neue, Arial, sans-serif`;
    o.textAlign = "center";
    o.textBaseline = "middle";

    o.fillStyle = "white";

    o.fillText(text, W / 2, H / 2);

    const pixels = o.getImageData(0, 0, W, H).data;
    const points = [];

    const gap = W < 600 ? 4 : 5;

    for (let y = 0; y < H; y += gap) {
        for (let x = 0; x < W; x += gap) {
            const i = (y * W + x) * 4;

            if (pixels[i + 3] > 128) {
                points.push({
                    x: x + (Math.random() - 0.5) * 2,
                    y: y + (Math.random() - 0.5) * 2,
                    color
                });
            }
        }
    }

    return points;
}

/* ==========================================
   FORM WORD
========================================== */

function formWord(text, color = WHITE) {
    roseMode = color === ROSE;

    wordEl.classList.toggle("rose", roseMode);

    const points = getTextPoints(text, color);

    particles = points.map(p =>
        new Particle(p.x, p.y, p.color, Math.random() * 1.5 + 0.7)
    );

    wordEl.style.opacity = "0";
}

/* ==========================================
   PARTICLE HEART
========================================== */

function getHeartPoints(color = ROSE) {
    const points = [];

    const scale = Math.min(W, H) * 0.012;

    const cx = W / 2;
    const cy = H / 2 + 25;

    for (let t = 0; t < Math.PI * 2; t += 0.035) {
        const x = 16 * Math.pow(Math.sin(t), 3);

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        points.push({
            x: cx + x * scale,
            y: cy - y * scale,
            color
        });
    }

    // Fill the heart with smaller particles
    for (let i = 0; i < 230; i++) {
        const t = Math.random() * Math.PI * 2;

        const x = 16 * Math.pow(Math.sin(t), 3);

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        const shrink = Math.sqrt(Math.random()) * 0.85;

        points.push({
            x: cx + x * scale * shrink,
            y: cy - y * scale * shrink,
            color
        });
    }

    return points;
}

function formHeart() {
    heartMode = true;

    const points = getHeartPoints(ROSE);

    particles = points.map(p =>
        new Particle(p.x, p.y, p.color, Math.random() * 2 + 0.8)
    );
}

/* ==========================================
   EXPLOSION
========================================== */

function explode(force = 10) {
    particles.forEach(p => p.explode(force));
}

/* ==========================================
   SCREEN FLASH
========================================== */

async function flash(amount = 0.12) {
    flashEl.style.transition = "none";
    flashEl.style.opacity = amount;

    await sleep(40);

    flashEl.style.transition = "opacity 700ms ease";
    flashEl.style.opacity = 0;
}

/* ==========================================
   UTILITIES
========================================== */

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function clearScene() {
    particles = [];
    roseMode = false;
    heartMode = false;

    wordEl.textContent = "";
    wordEl.classList.remove("rose");
    wordEl.style.opacity = 0;

    flashEl.style.opacity = 0;
}

/* ==========================================
   MAIN ANIMATION LOOP
========================================== */

function animate() {
    ctx.clearRect(0, 0, W, H);

    drawNebula();
    drawStars();

    particles.forEach(p => {
        p.update();
        p.draw();
    });

    particles = particles.filter(p => p.alpha > 0);

    animationId = requestAnimationFrame(animate);
}

/* ==========================================
   CINEMATIC TIMELINE
========================================== */

async function sequence() {
    if (running) return;

    running = true;

    clearScene();

    // SPACE INTRO
    await sleep(1200);

    // 1. YOU
    formWord("You", WHITE);
    await sleep(2400);

    // EXPLOSION
    explode(12);
    await flash(0.10);
    await sleep(650);

    // 2. LOST
    formWord("Lost", WHITE);
    await sleep(1500);

    // QUICK EXPLOSION
    explode(14);
    await sleep(380);

    // 3. ME
    formWord("Me", WHITE);
    await sleep(1300);

    // WHITE TO ROSE
    roseMode = true;
    wordEl.classList.add("rose");

    await sleep(500);

    // TRANSFORM ME INTO FOREVER
    explode(9);
    await sleep(350);

    formWord("Forever", ROSE);

    // SLOW ROSE GLOW
    await sleep(2200);

    // FOREVER DISAPPEARS
    explode(7);
    await sleep(600);

    // HEART FORMS
    formHeart();

    await sleep(1200);

    // HEART GLOW
    await sleep(1800);

    // FINAL EXPLOSION
    explode(13);
    await flash(0.16);

    await sleep(2800);

    clearScene();

    running = false;
}

/* ==========================================
   START / REPLAY
========================================== */

function start() {
    cancelAnimationFrame(animationId);

    resize();

    clearScene();

    animate();

    sequence();
}

window.addEventListener("click", () => {
    if (!running) start();
});

// INITIALIZE
resize();
animate();
sequence();

</script>
</body>
</html>
